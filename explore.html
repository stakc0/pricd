ocaleString(undefined,{maximumFractionDigits:0});fetch('/api/tokens').then(r=>r.json()).then(j=>{const tokens=j.tokens||[];if(!tokens.length){empty.hidden=false;return}empty.hidden=true;grid.innerHTML=tokens.map(t=>`<a class="panel" style="overflow:hidden" href="https://pump.fun/coin/${t.mint}" target="_blank"><div style="aspect-ratio:4/3;background:#111">${t.image?`<img src="${t.image}" style="width:100%;height:100%;object-fit:cover">`:`<div class="cond" style="display:grid;place-items:center;height:100%;font-size:80px;color:#ff10f4">${(t.symbol||'?')[0]}</div>`}</div><div style="padding:20px"><h3 class="cond" style="font-size:32px;margin:0">${t.name||'BODIE model'}</h3><p class="pink" style="font-weight:900">$${t.symbol||'TOKEN'}</p><p class="muted">MC $${fmt(t.marketCapUsd)} · VOL $${fmt(t.volume24hUsd)}</p></div></a>`).join('')}).catch(()=>{empty.hidden=false;empty.textContent='Could not load launches yet.'})</script></body></html>
