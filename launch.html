parent;color:#fff;border:1px solid rgba(255,255,255,.22)}.panel{border:1px solid var(--line);background:rgba(20,20,22,.86);border-radius:30px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 28px 90px rgba(0,0,0,.34)}.muted{color:var(--muted)}.pink{color:var(--hot)}input,textarea{font-family:Aeonik,system-ui,sans-serif!important}.field{width:100%;border:1px solid rgba(255,255,255,.1);background:#101012;border-radius:16px;padding:14px;color:#fff;outline:none}.field:focus{border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,16,244,.18)}@media(max-width:900px){.links{display:none}.hero,.grid2,.grid3{grid-template-columns:1fr!important}}</style></head><body><header class="wrap"><div class="nav"><a href="/" style="display:flex;align-items:center;gap:12px"><img src="/bodie-logo.jpg" style="width:38px;height:38px;border-radius:10px;object-fit:cover"><span class="cond" style="font-size:30px">BODIE</span></a><div class="links"><a class="" href="/">Home</a><a class="active" href="/launch">Launch</a><a class="" href="/explore">Explore</a><a class="" href="/girlfriends">Models</a><a href="https://x.com/bodietech">X</a></div><a class="btn" href="/launch">Launch</a></div></header><main class="wrap grid2" style="display:grid;grid-template-columns:.88fr 1.12fr;gap:34px;padding:46px 24px 80px"><section><p class="pink" style="font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase">Launchpad</p><h1 class="cond" style="font-size:clamp(54px,8vw,112px);margin:16px 0">Launch an AI model.</h1><p class="muted" style="font-size:18px;line-height:1.45;font-weight:650">Upload the model image, choose her name and ticker, then sign the pump.fun create and initial buy transactions in your wallet.</p><div class="panel" style="margin-top:24px;padding:18px"><b>Powered by</b><br><img src="/powered-by.png" style="margin-top:12px;width:110px;background:#fff;border-radius:16px;padding:8px"></div></section><section class="panel" style="padding:24px"><form id="launchForm" style="display:grid;gap:14px"><label>Token image<input class="field" name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required></label><label>Model / token name<input class="field" name="name" placeholder="Bodie Girl" maxlength="32" required></label><label>Ticker<input class="field" name="symbol" placeholder="BODIE" maxlength="10" pattern="[A-Za-z0-9]{2,10}" required></label><label>Description<textarea class="field" name="description" rows="4" placeholder="An AI model with her own token and onchain audience." required></textarea></label><label>Destination website<input class="field" name="domainUrl" type="url" value="https://www.bodie.tech" required></label><label>Initial buy SOL<input class="field" name="initialBuySol" inputmode="decimal" value="0.05" required></label><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="connect" class="btn" type="button">Connect wallet</button><button class="btn white" type="submit">Prepare launch</button></div><pre id="status" class="panel" style="min-height:120px;white-space:pre-wrap;padding:14px;color:#aaaab4">Ready.</pre></form></section></main><script type="module">import{VersionedTransaction}from'https://esm.sh/@solana/web3.js@1.98.2';const $=s=>document.querySelector(s),status=$('#status');let wallet=null;function log(x){status.textContent=x}async function connect(){const p=window.solana;if(!p?.isPhantom)throw new Error('Install Phantom or a Solana wallet.');const r=await p.connect();wallet={provider:p,address:r.publicKey.toBase58()};log('Connected '+wallet.address);return wallet}$('#connect').onclick=()=>connect().catch(e=>log(e.message));$('#launchForm').onsubmit=async ev=>{ev.preventDefault();try{if(!wallet)await connect();const fd=new FormData(ev.currentTarget);const launch={wallet:wallet.address,name:String(fd.get('name')).trim(),symbol:String(fd.get('symbol')).trim().toUpperCase(),description:String(fd.get('description')).trim(),domainUrl:String(fd.get('domainUrl')).trim(),initialBuySol:String(fd.get('initialBuySol')).trim()};const body=new FormData();const image=fd.get('image');body.set('image',image,image.name||'bodie-token.png');body.set('launch',JSON.stringify(launch));log('Preparing launch…');const prep=await fetch('/api/deploy',{method:'POST',body}).then(async r=>{const j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw new Error(j.error||'Prepare failed');return j});let sigs=[];for(const txInfo of prep.transactions){const tx=VersionedTransaction.deserialize(Uint8Array.from(atob(txInfo.transaction),c=>c.charCodeAt(0)));const signed=await wallet.provider.signTransaction(tx);const signed64=btoa(String.fromCharCode(...signed.serialize()));log('Submitting '+txInfo.phase+' transaction…');const out=await fetch('/api/deploy-confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({intentId:prep.intentId,transaction:signed64})}).then(async r=>{const j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok)throw new Error(j.error||'Submit failed');return j});sigs.push(out.signature)}log('Launched '+prep.name+' ($'+prep.symbol+')
Mint: '+prep.mint+'
Pump: https://pump.fun/coin/'+prep.mint+'
'+sigs.join('
'))}catch(e){log('Error: '+(e.message||e))}};</script></body></html>
