<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bodies · BODIE</title><meta name="description" content="Manage or open AI body launches created through BODIE."><link rel="stylesheet" href="/_next/static/css/c76dde9f39b6677d.css%3Fdpl=dpl_FBW9QmdiPKeC4rPrMoXMDDiRGGRg.css"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>:root{--color-accent:#ff10f4;--color-accent-strong:#ff10f4;--color-accent-soft:#ff10f424;--color-lime:#ff10f4;--color-lime-deep:#d81b7d;--color-positive:#ffffff}body{background:radial-gradient(circle at 50% 0%,rgba(255,93,175,.14),transparent 38%),#0d0d0d}.btn{background:#ff10f4;color:#18000c;border-radius:14px;padding:12px 18px;font-weight:800}.card{border:1px solid rgba(255,255,255,.08);background:#141416;border-radius:28px;overflow:hidden}</style></head><body><header class="sticky top-0 z-40 border-b border-white/[0.06] bg-[#0d0d0d]/90 backdrop-blur-md"><div class="mx-auto flex h-14 max-w-[1400px] items-center justify-between px-4 sm:px-6 lg:px-8"><a class="inline-flex items-center gap-2.5" href="/"><img src="/bodie-logo.jpg" class="h-8 w-8 rounded-xl object-cover"><span class="font-condensed text-[22px] font-bold uppercase text-fg">BODIE</span></a><nav class="hidden items-center gap-7 text-[13.5px] font-medium text-fg-muted lg:flex"><a href="/explore">Explore</a><a href="/launch">Launch</a><a href="/girlfriends">My Bodies</a><a href="/docs">Docs</a></nav><a class="btn hidden sm:inline-flex" href="/launch">Launch</a></div></header><main class="mx-auto min-h-screen max-w-[1400px] px-4 py-16 sm:px-6 lg:px-8"><p class="font-mono text-[12px] uppercase tracking-[.18em] text-lime">Official BODIE launches</p><h1 class="display-xl mt-4 text-[clamp(48px,8vw,104px)]">My Bodies</h1><p class="mt-5 max-w-2xl text-[17px] leading-relaxed text-fg-muted">Manage or open AI body launches created through BODIE.</p><div id="empty" hidden class="card mt-12 p-8 sm:p-10"><h2 class="font-condensed text-4xl font-bold uppercase text-fg">No girls launched yet</h2><p class="mt-2 text-fg-muted">Launches created through BODIE will appear here automatically.</p><a class="btn mt-6 inline-flex" href="/launch">Launch an AI body</a></div><div id="grid" class="mt-12 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div></main><script>const grid=document.querySelector('#grid'),empty=document.querySelector('#empty');const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});fetch('/api/tokens').then(r=>r.json()).then(j=>{const tokens=j.tokens||[];if(!tokens.length){empty.hidden=false;return}empty.hidden=true;grid.innerHTML=tokens.map(t=>`<a class="card group" href="https://pump.fun/coin/${t.mint}" target="_blank" rel="noopener"><div class="aspect-[4/3] bg-[#20131a]">${t.image?`<img src="${t.image}" class="h-full w-full object-cover">`:`<div class="grid h-full place-items-center text-5xl font-bold text-lime">${(t.symbol||'?')[0]}</div>`}</div><div class="p-5"><div class="font-condensed text-3xl font-bold uppercase text-fg">${t.name||'BODIE girl'}</div><div class="mt-1 font-mono text-sm text-lime">$${t.symbol||'TOKEN'}</div><div class="mt-4 grid grid-cols-2 gap-3 text-sm text-fg-muted"><span>MC <b class="text-fg">$${fmt(t.marketCapUsd)}</b></span><span>24h <b class="text-fg">$${fmt(t.volume24hUsd)}</b></span></div><div class="mt-4 break-all font-mono text-[11px] text-fg-subtle">${t.mint}</div></div></a>`).join('')}).catch(()=>{empty.hidden=false;empty.textContent='Could not load launches yet.'})</script><script id="bodie-market-poll">(()=>{const MINT='7CnFHJrkxPeeDtXvGHiEMGvA9yB6heaSyef3kGAFpump';const fmt=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});function ensure(){let el=document.getElementById('bodie-market-pill');if(el)return el;el=document.createElement('a');el.id='bodie-market-pill';el.href='https://dexscreener.com/solana/'+MINT;el.target='_blank';el.rel='noopener';el.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.12);background:rgba(13,13,13,.82);backdrop-filter:blur(12px);color:#f5f5f7;border-radius:999px;padding:9px 13px;font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 12px 36px rgba(0,0,0,.35)';document.body.appendChild(el);return el}async function poll(){try{const j=await fetch('/api/bodie-market?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());const el=ensure();el.innerHTML=`<span style="color:#ff10f4">$BODIE</span><span>MC $${fmt(j.marketCapUsd)}</span><span>VOL $${fmt(j.volume24hUsd)}</span>`}catch{}}document.addEventListener('DOMContentLoaded',()=>{poll();setInterval(poll,10000)});})();</script></body></html>
